<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>DECAFUM — Perfumes & Decants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-dim:#7a6530;--dark:#111;--dark2:#1c1c1c;--dark3:#252525;--text:#e8e0d0;--text-muted:#888880;--text-dim:#555550;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--dark);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;}
.hero{position:relative;padding:2.5rem 1.5rem 1.75rem;text-align:center;border-bottom:0.5px solid #2a2a2a;overflow:hidden;}
.hp{position:absolute;inset:0;opacity:.04;background-image:repeating-linear-gradient(45deg,var(--gold) 0,var(--gold) 1px,transparent 0,transparent 50%);background-size:12px 12px;}
.hi{position:relative;}
.hero-pre{font-size:10px;letter-spacing:.35em;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.8rem,14vw,4.2rem);font-weight:600;letter-spacing:.12em;color:var(--gold);line-height:1;margin-bottom:4px;}
.hero-sub{font-size:10px;letter-spacing:.3em;color:var(--text-dim);text-transform:uppercase;}
.hero-tag{margin-top:1rem;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--text-muted);}
.loyalty{margin:1rem 1rem 0;background:var(--dark2);border:0.5px solid var(--gold-dim);border-radius:var(--rs);padding:10px 14px;display:flex;align-items:center;gap:10px;}
.loyalty p{font-size:12px;color:var(--text-muted);line-height:1.4;}
.loyalty strong{color:var(--gold);font-weight:500;}
.filters{padding:1rem;}
.search-box{position:relative;margin-bottom:10px;}
.search-box input{width:100%;background:var(--dark2);border:0.5px solid #333;border-radius:30px;padding:10px 16px 10px 38px;color:var(--text);font-family:'Jost',sans-serif;font-size:14px;font-weight:300;outline:none;}
.search-box input::placeholder{color:var(--text-dim);}
.search-box input:focus{border-color:var(--gold-dim);}
.si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:15px;pointer-events:none;}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.pills::-webkit-scrollbar{display:none;}
.pill{flex-shrink:0;padding:6px 16px;border-radius:20px;border:0.5px solid #333;background:transparent;color:var(--text-muted);font-family:'Jost',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;}
.pill.active{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:500;}
.count{padding:0 1rem 10px;font-size:10px;letter-spacing:.25em;color:var(--text-dim);text-transform:uppercase;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1e1e1e;border-top:1px solid #1e1e1e;}
.card{background:var(--dark);cursor:pointer;transition:background .12s;position:relative;}
.card:active{background:var(--dark2);}
.card.featured{border-top:1.5px solid var(--gold);}
.card-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.card-img-ph{width:100%;aspect-ratio:1/1;background:var(--dark3);display:flex;align-items:center;justify-content:center;font-size:44px;}
.card-body{padding:10px 10px 28px;}
.card-gender{font-size:9px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:3px;}
.cg-w{color:#d4a0b5;}.cg-m{color:#88aed4;}.cg-u{color:#85c4a5;}.cg-e{color:var(--gold);}
.card-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:500;color:var(--text);line-height:1.2;margin-bottom:2px;}
.card-brand{font-size:10px;color:var(--text-dim);letter-spacing:.04em;margin-bottom:6px;}
.card-price{font-size:12px;color:var(--gold);}
.card-price span{color:var(--text-dim);font-size:10px;}
.card-arrow{position:absolute;bottom:8px;right:10px;color:var(--text-dim);font-size:14px;}
.no-results{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--text-dim);background:var(--dark);}
.contact-bar{position:sticky;bottom:0;background:var(--dark2);border-top:0.5px solid #2a2a2a;padding:12px 1.5rem;display:flex;align-items:center;justify-content:space-between;}
.contact-bar p{font-size:11px;color:var(--text-dim);}
.wa-btn{display:flex;align-items:center;gap:7px;background:#25d366;color:#fff;border:none;border-radius:20px;padding:8px 16px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;}
.wa-btn svg{width:16px;height:16px;fill:white;flex-shrink:0;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:flex-end;}
.overlay.open{display:flex;}
.modal{background:var(--dark2);border-radius:var(--r) var(--r) 0 0;width:100%;max-height:93vh;overflow-y:auto;border-top:1px solid var(--gold-dim);animation:su .22s ease;}
@keyframes su{from{transform:translateY(36px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhandle{width:36px;height:3px;background:#444;border-radius:2px;margin:10px auto 0;}
.m-img{width:100%;max-height:300px;object-fit:cover;display:block;}
.mheader{padding:1rem 1.25rem .75rem;border-bottom:0.5px solid #2e2e2e;}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.mclose{background:var(--dark3);border:none;color:var(--text-muted);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.m-gen{font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:3px;}
.m-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;color:var(--text);line-height:1.1;}
.m-brand{font-size:11px;color:var(--text-dim);letter-spacing:.08em;margin-top:2px;}
.mbody{padding:1.1rem 1.25rem 2rem;}
.m-desc{font-size:13px;color:var(--text-muted);line-height:1.7;margin-bottom:1.1rem;font-weight:300;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;}
.pblock{background:var(--dark3);border-radius:var(--rs);padding:12px;text-align:center;border:0.5px solid #333;}
.pblock.full{grid-column:1/-1;}
.psize{font-size:11px;color:var(--text-dim);letter-spacing:.1em;margin-bottom:3px;}
.pamt{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;color:var(--gold);line-height:1;}
.punit{font-size:10px;color:var(--text-dim);margin-top:2px;}
.mnote{background:var(--dark);border-left:2px solid var(--gold-dim);padding:9px 12px;font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:1rem;}
.mnote strong{display:block;color:var(--text);font-weight:500;margin-bottom:2px;font-size:12px;}
.obtn{width:100%;background:#25d366;color:#fff;border:none;border-radius:30px;padding:13px;font-family:'Jost',sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.obtn svg{width:18px;height:18px;fill:white;}
</style>
</head>

let filt='all';
function setF(f,el){filt=f;document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function fmt(n){return '\u20a1'+n.toLocaleString('es-CR');}
function gI(g){
  if(g==='mujer')return{l:'Para mujer',c:'cg-w'};
  if(g==='hombre')return{l:'Para hombre',c:'cg-m'};
  if(g==='unisex')return{l:'Unisex',c:'cg-u'};
  return{l:'Estuche',c:'cg-e'};
}
function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const fl=P.filter(p=>{
    const mf=filt==='all'||p.g===filt;
    const ms=!q||p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q);
    return mf&&ms;
  });
  document.getElementById('cnt').textContent=fl.length+' '+(fl.length===1?'producto':'productos');
  const grid=document.getElementById('grid');
  if(!fl.length){grid.innerHTML='<div class="no-results">Sin resultados</div>';return;}
  grid.innerHTML=fl.map(p=>{
    const g=gI(p.g);
    const imgSrc=p.img&&IMGS[p.img]?IMGS[p.img]:'';
    const priceStr=p.priceS?`<span>${p.priceS}</span> <span style="color:var(--text-dim);font-size:10px">set</span>`:`<span>5ml ${fmt(p.p5)}</span>`;
    const imgHtml=imgSrc?`<img class="card-img" src="${imgSrc}" alt="${p.name}" loading="lazy"/>`:`<div class="card-img-ph">🍾</div>`;
    return `<div class="card${p.g==='estuche'?' featured':''}" onclick="openM(${p.id})">${imgHtml}<div class="card-body"><p class="card-gender ${g.c}">${g.l}</p><p class="card-name">${p.name}</p><p class="card-brand">${p.brand}</p><p class="card-price">${priceStr}</p></div><span class="card-arrow">›</span></div>`;
  }).join('');
}
function openM(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  const g=gI(p.g);
  const mg=document.getElementById('m-gen');mg.textContent=g.l;mg.className='m-gen '+g.c;
  document.getElementById('m-name').textContent=p.name;
  document.getElementById('m-brand').textContent=p.brand.toUpperCase();
  const mi=document.getElementById('m-img');
  if(p.img&&IMGS[p.img]){mi.src=IMGS[p.img];mi.style.display='block';}else{mi.style.display='none';}
  document.getElementById('m-desc').textContent=p.desc;
  const np=document.getElementById('m-note');
  if(p.note){np.style.display='block';np.innerHTML='<strong>Nota</strong>'+p.note;}else{np.style.display='none';}
  const mp=document.getElementById('m-prices');
  if(p.priceS){mp.innerHTML=`<div class="pblock full"><p class="psize">Set completo</p><p class="pamt">${p.priceS}</p><p class="punit">colones</p></div>`;}
  else{mp.innerHTML=`<div class="pblock"><p class="psize">5 ml</p><p class="pamt">${fmt(p.p5)}</p><p class="punit">colones</p></div><div class="pblock"><p class="psize">10 ml</p><p class="pamt">${fmt(p.p10)}</p><p class="punit">colones</p></div>`;}
  const msg=encodeURIComponent('Hola Dereck! Me interesa el decant de '+p.name+' ('+p.brand+'). ¿Está disponible?');
  document.getElementById('m-order').onclick=()=>window.open('https://wa.me/50671267535?text='+msg,'_blank');
  document.getElementById('ov').classList.add('open');
  document.getElementById('mbox').scrollTop=0;
}
function closeM(e){if(e.target===document.getElementById('ov'))document.getElementById('ov').classList.remove('open');}
render();
</script>
